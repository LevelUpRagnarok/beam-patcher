# Dosya Yolu: .github/workflows/ragnar-legacy-theme-qa.yml
# Amac: Ragnar classic Beam theme CSS/config/JS contract QA
# Modul - GitHub Actions YAML
# Version: 0.3.3-candidate
# Aciklama: Offline source check only, no game files/patcher binary/release.
# Bagimli Oldugu Katman: tools/tests/test_ragnar_legacy_theme.py | beam-ui/public/index.html
name: Turkuaz Ragnarok Online Launcher Theme QA

on:
  push:
    branches: [main]
    paths:
      - "beam-ui/public/index.html"
      - "beam-ui/public/assets/ragnar-legacy.css"
      - "beam-ui/public/assets/ragnar-classic.css"
      - "beam-ui/public/assets/levelup-modern.css"
      - "beam-ui/public/assets/turkuaz-premium.css"
      - "beam-ui/public/assets/turkuaz-reference-restore.css"
      - "beam-ui/public/assets/turkuaz-user-*.svg"
      - "beam-ui/public/assets/turkuaz-*.svg"
      - "themes/ragnar-classic/**"
      - "themes/levelup-modern/**"
      - "themes/README.md"
      - "tools/tests/test_ragnar_classic_theme.py"
      - "tools/tests/test_levelup_modern_theme.py"
      - "tools/tests/test_turkuaz_branding.py"
      - "tools/tests/test_turkuaz_premium_theme.py"
      - "tools/tests/test_turkuaz_reference_restore.py"
      - "tools/QA-THEME-BROWSER.py"
      - "tools/Test-BeamNativeClassicUi.ps1"
      - "themes/ragnar-legacy/**"
      - "tools/tests/test_ragnar_legacy_theme.py"
      - ".github/workflows/ragnar-legacy-theme-qa.yml"
  pull_request:
    paths:
      - "beam-ui/public/index.html"
      - "beam-ui/public/assets/ragnar-legacy.css"
      - "beam-ui/public/assets/ragnar-classic.css"
      - "beam-ui/public/assets/levelup-modern.css"
      - "beam-ui/public/assets/turkuaz-premium.css"
      - "beam-ui/public/assets/turkuaz-reference-restore.css"
      - "beam-ui/public/assets/turkuaz-user-*.svg"
      - "beam-ui/public/assets/turkuaz-*.svg"
      - "themes/ragnar-classic/**"
      - "themes/levelup-modern/**"
      - "themes/README.md"
      - "tools/tests/test_ragnar_classic_theme.py"
      - "tools/tests/test_levelup_modern_theme.py"
      - "tools/tests/test_turkuaz_branding.py"
      - "tools/tests/test_turkuaz_premium_theme.py"
      - "tools/tests/test_turkuaz_reference_restore.py"
      - "tools/QA-THEME-BROWSER.py"
      - "tools/Test-BeamNativeClassicUi.ps1"
      - "themes/ragnar-legacy/**"
      - "tools/tests/test_ragnar_legacy_theme.py"
      - ".github/workflows/ragnar-legacy-theme-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert opt-in theme, preview and 2015 patch channel isolation
        run: python3 -B -m unittest discover -s tools/tests -p 'test_ragnar_legacy_theme.py' -v
      - name: Seven screenshot-based classic launcher UI layout and safety contracts
        run: python3 -B -m unittest discover -s tools/tests -p 'test_ragnar_classic_theme.py' -v
      - name: Turkuaz Modern preference, settings, and offline visual QA
        run: python3 -B -m unittest discover -s tools/tests -p 'test_levelup_modern_theme.py' -v
      - name: Turkuaz visible branding and safe QA compatibility contract
        run: python3 -B -m unittest discover -s tools/tests -p 'test_turkuaz_branding.py' -v
      - name: Premium artwork SVG validity and visual safety contracts
        run: python3 -B -m unittest discover -s tools/tests -p 'test_turkuaz_premium_theme.py' -v
      - name: User reference images and native buttons restore contract
        run: python3 -B -m unittest discover -s tools/tests -p 'test_turkuaz_reference_restore.py' -v
      - name: Extract inline Beam UI JavaScript for syntax validation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("beam-ui/public/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>\s*(.*?)</script>", html, flags=re.S)
          assert len(scripts) == 1, f"Expected one inline JS script, found {len(scripts)}"
          Path("/tmp/ragnar-beam-ui-inline.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/ragnar-beam-ui-inline.js

  # Browser rendering evidence; this is not the native Tauri/WebView2 smoke test.
  chromium-theme-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - name: Checkout branch without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python for deterministic browser QA
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Playwright (use hosted Chrome)
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir playwright==1.56.0
          google-chrome --version
      - name: Render all four themes and verify restart persistence (offline mocked Tauri)
        run: |
          python tools/QA-THEME-BROWSER.py --output-dir build/theme-visual-qa --source-sha "${{ github.sha }}"
      - name: Upload short-lived screenshot proof (not a release)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: beam-themes-chromium-qa-${{ github.sha }}
          path: build/theme-visual-qa
          retention-days: 7
          if-no-files-found: error

  # Real Windows executable and native Tauri/WebView2 startup acceptance.
  # A QA-only portable ZIP is emitted for user acceptance, never a setup/release.
  windows-native-classic-qa:
    name: Windows real Beam Tauri Classic UI QA (no game or patch)
    runs-on: windows-2025
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Checkout exact branch without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile actual Windows native Beam executable
        shell: pwsh
        run: |
          cargo build --release -p beam-patcher
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'target/release/beam-patcher.exe' -PathType Leaf)) {
            throw 'Beam native executable missing'
          }
      - name: Stage offline QA-only standalone app, not an installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = 'build/native-classic-qa/portable'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item 'target/release/beam-patcher.exe' (Join-Path $dest 'beam-patcher.exe')
          $config = Get-Content 'installer/windows/config.qa.yml' -Raw -Encoding UTF8
          if ($config -notmatch '(?m)^\s*qa_only:\s*true\s*$') {
            throw 'Protected QA-only config marker is missing'
          }
          $old = '  theme: "levelup-modern"'
          if (-not $config.Contains($old)) { throw 'Expected QA theme selector missing' }
          $config = $config.Replace($old, '  theme: "ragnar-classic"')
          Set-Content -LiteralPath (Join-Path $dest 'config.yml') -Value $config -Encoding UTF8
          Copy-Item -LiteralPath 'beam-ui/public/assets' -Destination (Join-Path $dest 'assets') -Recurse
          @'
          BEAM PATCHER - UNSIGNED CLASSIC QA / TEST MODU
          This is a portable test artifact, NOT a release, installer, or game client.
          Real launcher GUI uses Windows Tauri/WebView2 on 900x620.
          No game executable is configured; qa_only=true.
          Live patch/update and game launch are NOT part of this test.
          The profile contains only disabled loopback patch URLs.
          Launch beam-patcher.exe and inspect button positions/theme controls.
          Do not place this folder inside a real game installation.
          '@ | Set-Content -LiteralPath (Join-Path $dest 'README-QA.txt') -Encoding UTF8
      - name: Run real native Windows Tauri GUI QA smoke
        shell: pwsh
        run: |
          ./tools/Test-BeamNativeClassicUi.ps1 -ExecutablePath 'build/native-classic-qa/portable/beam-patcher.exe' -ConfigPath 'build/native-classic-qa/portable/config.yml' -EvidenceDirectory 'build/native-classic-qa/evidence'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve native GUI failure evidence without distributing executable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beam-classic-native-evidence-${{ github.sha }}
          path: build/native-classic-qa/evidence
          retention-days: 5
          if-no-files-found: warn
      - name: Upload QA-only native executable only after acceptance (never setup)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: beam-classic-native-windows-qa-${{ github.sha }}
          path: |
            build/native-classic-qa/portable
            build/native-classic-qa/evidence
          retention-days: 5
          if-no-files-found: error
