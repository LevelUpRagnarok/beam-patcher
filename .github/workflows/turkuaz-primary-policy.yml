# Dosya Yolu: REPO_ROOT/.github/workflows/turkuaz-primary-policy.yml
# Amac: TURKUAZ-ONLY-001 sadece TurkuazInstaller primary icin fail-closed dagitim kapisi
# Modul - GitHub Actions / Windows Turkuaz-only installer
# Version: 2.0.0-candidate
# Aciklama: Imza/trust/yerel E2E olmadan primary dagitmaz; ikinci installer yok
# Bagimli Oldugu Katman: tools/verify_installer_primary.py | TurkuazLabs/TurkuazInstaller

name: Beam TurkuazInstaller Primary Only

on:
  pull_request:
    paths:
      - "installer/windows/**"
      - "tools/verify_installer_primary.py"
      - "tools/check_installer_workflows.py"
      - "tools/Confirm-TurkuazTrust.ps1"
      - "tools/Assert-BeamManifestSetupBinding.ps1"
      - "tools/Test-BeamTrustNegative.ps1"
      - ".github/workflows/**"
      - "docs/INSTALLER-STRATEGY-TURKUAZ.md"
      - "docs/WINDOWS-SETUP-PATCH-QA.md"
      - "tools/tests/test_installer_distribution_policy.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beam-turkuaz-primary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce only TurkuazInstaller primary distribution
        run: python tools/check_installer_workflows.py
      - name: Test installer proof gate negative cases
        run: python -m unittest discover -s tools/tests -p 'test_installer_distribution_policy.py' -v

  # No release/signing credentials. Exercise real PowerShell negative paths
  # on Windows so a broken trust parser blocks protected distribution.
  trust-negative-fixtures:
    name: Windows no-secret manifest and CMS preflight negatives
    runs-on: windows-latest
    needs: policy-contract
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject tampered setup, bad manifest identity and oversized CMS
        shell: pwsh
        run: ./tools/Test-BeamTrustNegative.ps1

  # Explicitly dispatched only. A PR does NOT produce/share a setup file.
  # A signed Turkuaz product bundle MUST come from a separately secured signing
  # and real installer acceptance process. Missing materials -> fail closed.
  build-primary-and-gate:
    if: github.event_name == 'workflow_dispatch'
    needs: [policy-contract, trust-negative-fixtures]
    runs-on: windows-latest
    timeout-minutes: 120
    environment: windows-installer-signing
    steps:
      - name: Checkout Beam exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned Turkuaz Community source
        uses: actions/checkout@v4
        with:
          repository: TurkuazLabs/TurkuazInstaller
          ref: 1048931bf7498ab4d4440414c4463e6ee5e7421e
          path: build/turkuaz-upstream
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile and test actual Beam patcher
        shell: pwsh
        run: |
          cargo test -p beam-formats --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p beam-core --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release -p beam-patcher
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/QA-PATCH-E2E.py --exe target/release/beam-patcher.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assemble Beam Velopack full product package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path (Get-Location).Path 'build/turkuaz-stage'
          $primary = Join-Path (Get-Location).Path 'build/turkuaz-primary/primary'
          New-Item -ItemType Directory -Force -Path $stage, $primary | Out-Null
          Copy-Item target/release/beam-patcher.exe "$stage/beam-patcher.exe"
          Copy-Item installer/windows/config.qa.yml "$stage/config.yml"
          Copy-Item installer/windows/README-QA.txt "$stage/README-QA.txt"
          $tools = Join-Path $env:RUNNER_TEMP 'vpk-tools'
          dotnet tool install vpk --tool-path $tools --version 1.2.161
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vpk = Join-Path $tools 'vpk.exe'
          $out = Join-Path (Get-Location).Path 'build/turkuaz-vpk'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & $vpk --legacyConsole true --yes true --skip-updates true pack --runtime win-x64 --packId levelupgt.beampatcher.qa --packTitle "Turkuaz Ragnarok Online QA" --packVersion 1.0.1 --packDir $stage --mainExe beam-patcher.exe --outputDir $out --delta none --skipVeloAppCheck true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = Get-ChildItem -LiteralPath $out -Filter '*Setup.exe' | Select-Object -First 1
          $nupkg = Get-ChildItem -LiteralPath $out -Filter '*-full.nupkg' | Select-Object -First 1
          if (-not $setup -or -not $nupkg) { throw 'Real Velopack Setup/full nupkg missing' }
          Copy-Item $setup.FullName "$primary/Beam-Velopack-Setup.exe"
          Copy-Item $nupkg.FullName "$primary/Beam-full.nupkg"
      - name: Build genuine TurkuazInstaller Community bootstrapper and companion binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $upstream = Join-Path (Get-Location).Path 'build/turkuaz-upstream'
          $publish = Join-Path (Get-Location).Path 'build/turkuaz-unsigned'
          $parts = @(
            @('bootstrap', 'src/TurkuazInstaller.Bootstrapper/TurkuazInstaller.Bootstrapper.csproj'),
            @('winui', 'src/TurkuazInstaller.WinUI/TurkuazInstaller.WinUI.csproj'),
            @('cli', 'src/TurkuazInstaller.Cli/TurkuazInstaller.Cli.csproj')
          )
          foreach ($part in $parts) {
            dotnet publish (Join-Path $upstream $part[1]) --configuration Release --runtime win-x64 --self-contained true --output (Join-Path $publish $part[0])
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $joined = Join-Path (Get-Location).Path 'build/turkuaz-unsigned/combined'
          & (Join-Path $upstream 'tools/New-CombinedDistribution.ps1') -BootstrapRoot (Join-Path $publish 'bootstrap') -WinUiRoot (Join-Path $publish 'winui') -CliRoot (Join-Path $publish 'cli') -OutputRoot $joined
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $primary = Join-Path (Get-Location).Path 'build/turkuaz-primary/primary'
          Copy-Item -LiteralPath (Join-Path $joined 'TurkuazInstaller.Bootstrapper.exe') -Destination $primary
          Copy-Item -LiteralPath (Join-Path $joined 'app') -Destination (Join-Path $primary 'app') -Recurse
          Copy-Item -LiteralPath (Join-Path $joined 'cli') -Destination (Join-Path $primary 'cli') -Recurse
      - name: Verify trusted Turkuaz signing, detached manifest and native E2E proof
        shell: pwsh
        env:
          VERIFIED_SIGNED_BUNDLE: ${{ vars.BEAM_VERIFIED_TURKUAZ_BUNDLE }}
        run: |
          $ErrorActionPreference = 'Stop'
          # The signed bundle is produced/provisioned separately, in a protected
          # Windows signing environment. A missing or unverifiable bundle is FAIL.
          $trusted = $env:VERIFIED_SIGNED_BUNDLE
          if ([string]::IsNullOrWhiteSpace($trusted) -or -not (Test-Path -LiteralPath $trusted -PathType Container)) {
            throw 'TURKUAZ-ONLY-001: NO TRUSTED TURKUAZ SIGNER / E2E BUNDLE. Primary is NOT shareable.'
          }
          $primary = Join-Path (Get-Location).Path 'build/turkuaz-primary/primary'
          foreach ($item in @('installer-manifest.yml', 'installer-manifest.yml.p7s', 'manifest-trust.yml', 'turkuaz-primary-e2e.json')) {
            $src = Join-Path $trusted $item
            if (-not (Test-Path -LiteralPath $src -PathType Leaf)) { throw "Required signed evidence missing: $item" }
            Copy-Item -LiteralPath $src -Destination (Join-Path $primary $item)
          }
          # The protected signing job must provide the entire signed
          # Turkuaz combined distribution; unsigned source build never passes.
          foreach ($rel in @('TurkuazInstaller.Bootstrapper.exe','app/TurkuazInstaller.WinUI.exe','cli/TurkuazInstaller.Cli.exe')) {
            $signedExe = Join-Path $trusted $rel
            if (-not (Test-Path -LiteralPath $signedExe -PathType Leaf)) { throw "Signed Turkuaz runtime missing: $rel" }
            Copy-Item -LiteralPath $signedExe -Destination (Join-Path $primary $rel) -Force
          }
          $pin = "${{ vars.BEAM_TURKUAZ_CERT_SHA256 }}"
          $publisher = "${{ vars.BEAM_TURKUAZ_PUBLISHER_SUBJECT }}"
          & ./tools/Confirm-TurkuazTrust.ps1 -PrimaryDirectory $primary -PublisherSubject $publisher -CertificateSha256 $pin
          if ($LASTEXITCODE -ne 0) { throw 'Real CMS/Authenticode trust verification failed' }
          # A signed-provenance E2E run must be validated in addition to
          # this cryptographic check; JSON cannot alone approve a release.
          $evidence = Join-Path $trusted 'turkuaz-primary-e2e.json'
          Copy-Item -LiteralPath $evidence -Destination (Join-Path (Get-Location).Path 'build/turkuaz-evidence.json')
      - name: Fail-closed single Turkuaz primary hash and native E2E gate
        shell: pwsh
        run: |
          python tools/verify_installer_primary.py --bundle build/turkuaz-primary --evidence build/turkuaz-evidence.json --source-sha "${{ github.sha }}" --version 1.0.1 --report build/turkuaz-primary/primary/distribution-report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload only the verified TurkuazInstaller primary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TURKUAZ-PRIMARY-BEAM-QA-${{ github.sha }}
          path: build/turkuaz-primary/primary/
          if-no-files-found: error
          retention-days: 3
